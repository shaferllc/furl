name: Release

# Bump VERSION on main and this cuts a signed, notarized release through the
# shared shaferllc Mac release (shaferllc/.github). Run it by hand from the
# Actions tab for a dry run: build, sign, notarize and verify, publish nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — build, sign and notarize without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    uses: shaferllc/.github/.github/workflows/mac-release.yml@main
    with:
      app: Furl
      notes: >-
        A native macOS menu bar manager — hide the icons you don't need, keep the bar tidy. The Bartender category, built the house way: SwiftUI + AppKit, SwiftPM, `make-app.sh`, no Xcode project, no external dependencies, **no special permissions** (no screen recording, no accessibility).
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
